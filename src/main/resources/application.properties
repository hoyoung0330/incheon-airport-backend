# 서버 포트
server.port=8080

# DB 자동설정 임시 제외 (PostgreSQL 설치 전까지)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# 로그 레벨
logging.level.com.airport=DEBUG

# 로컬 환경 설정 활성화
spring.profiles.active=local